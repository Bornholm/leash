execution:
  max_duration: 30s
  max_output_bytes: 1048576
  max_commands_per_script: 50
  max_subshells: 3

rate_limits:
  global: 100/minute
  per_builtin: {}

allowed_binaries:
  - grep
  - sed
  - awk
  - sort
  - uniq
  - head
  - tail
  - wc
  - tr
  - cut
  - tee
  - cat
  - xargs
  - date
  - echo
  - printf
  - test

blocked_patterns:
  - "rm -rf"
  - "mkfs"
  - "dd if="
  - "> /dev/"
  - "chmod 777"

environment:
  inherit: false
  static:
    HOME: /tmp/leash
    PATH: /usr/bin:/bin
  # passthrough: liste de variables de l'environnement hôte à transmettre.
  # Utile par exemple pour SSH_AUTH_SOCK (agent SSH) ou TERM.
  passthrough: []

builtins:
  enabled: []          # vide = tous les builtins enregistrés sont autorisés
  require_confirmation: []

