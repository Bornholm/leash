name: CI

on:
  push:
    branches: ["master", "main", "feat/**"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap

      - name: Configure user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
